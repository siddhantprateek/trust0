<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Training t0-vision">
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#656d76}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect width="1200" height="320" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600">Training t0-vision</text>
<rect x="20" y="56" width="270" height="244" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
<text x="36" y="82" font-size="13" font-weight="600" class="m">1. Prepare</text>
<rect x="38" y="96" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="155.0" y="132.5" font-size="15" font-weight="600" text-anchor="middle">Download datasets</text>
<text class="m" x="155.0" y="151.5" font-size="12.5" text-anchor="middle">~400 GB from Hugging Face</text>
<rect x="38" y="201" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="155.0" y="229.0" font-size="15" font-weight="600" text-anchor="middle">Re-encode to 512 px JPEG</text>
<text class="m" x="155.0" y="248.0" font-size="12.5" text-anchor="middle">same for real and AI,</text>
<text class="m" x="155.0" y="265.0" font-size="12.5" text-anchor="middle">test images removed</text>
<line x1="155.0" y1="176" x2="155.0" y2="199" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="290" y1="178" x2="312" y2="178" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="314" y="56" width="270" height="244" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
<text x="330" y="82" font-size="13" font-weight="600" class="m">2. Baseline</text>
<rect x="332" y="96" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="449.0" y="132.5" font-size="15" font-weight="600" text-anchor="middle">Score off-the-shelf</text>
<text class="m" x="449.0" y="151.5" font-size="12.5" text-anchor="middle">detectors on 1,380 images</text>
<rect x="332" y="201" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="449.0" y="237.5" font-size="15" font-weight="600" text-anchor="middle">Quick run</text>
<text class="m" x="449.0" y="256.5" font-size="12.5" text-anchor="middle">50k images, 1 epoch</text>
<line x1="449.0" y1="176" x2="449.0" y2="199" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="584" y1="178" x2="606" y2="178" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="608" y="56" width="270" height="244" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
<text x="624" y="82" font-size="13" font-weight="600" class="m">3. Train</text>
<rect x="626" y="96" width="234" height="80" rx="10" fill="#f1efff" stroke="#6d5efc" stroke-width="1.5"/>
<text x="743.0" y="124.0" font-size="15" font-weight="600" text-anchor="middle">Fine-tune 5 epochs</text>
<text class="m" x="743.0" y="143.0" font-size="12.5" text-anchor="middle">50/50 real vs AI,</text>
<text class="m" x="743.0" y="160.0" font-size="12.5" text-anchor="middle">random JPEG + resize</text>
<rect x="626" y="201" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="743.0" y="237.5" font-size="15" font-weight="600" text-anchor="middle">Keep best epoch</text>
<text class="m" x="743.0" y="256.5" font-size="12.5" text-anchor="middle">by validation AUC</text>
<line x1="743.0" y1="176" x2="743.0" y2="199" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="878" y1="178" x2="900" y2="178" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="902" y="56" width="270" height="244" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/>
<text x="918" y="82" font-size="13" font-weight="600" class="m">4. Ship</text>
<rect x="920" y="96" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="1037.0" y="132.5" font-size="15" font-weight="600" text-anchor="middle">Benchmark</text>
<text class="m" x="1037.0" y="151.5" font-size="12.5" text-anchor="middle">vs open-source detectors</text>
<rect x="920" y="201" width="234" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="1037.0" y="237.5" font-size="15" font-weight="600" text-anchor="middle">Serve in trust0 API</text>
<text class="m" x="1037.0" y="256.5" font-size="12.5" text-anchor="middle">/v1/models/predict</text>
<line x1="1037.0" y1="176" x2="1037.0" y2="199" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
</svg>