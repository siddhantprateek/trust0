<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="How a trust0 check works">
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#656d76}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect width="1180" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600">How a trust0 check works</text>
<rect x="20" y="139.0" width="160" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="100.0" y="173.0" font-size="15" font-weight="600" text-anchor="middle">1. Ingest</text>
<text class="m" x="100.0" y="192.0" font-size="12.5" text-anchor="middle">post, video,</text>
<text class="m" x="100.0" y="209.0" font-size="12.5" text-anchor="middle">captions, transcript</text>
<rect x="215" y="139.0" width="160" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="295.0" y="173.0" font-size="15" font-weight="600" text-anchor="middle">2. Fingerprint</text>
<text class="m" x="295.0" y="192.0" font-size="12.5" text-anchor="middle">16 keyframes, pHash,</text>
<text class="m" x="295.0" y="209.0" font-size="12.5" text-anchor="middle">C2PA markers</text>
<rect x="410" y="64.0" width="160" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="490.0" y="98.0" font-size="15" font-weight="600" text-anchor="middle">3. Provenance</text>
<text class="m" x="490.0" y="117.0" font-size="12.5" text-anchor="middle">trace the</text>
<text class="m" x="490.0" y="134.0" font-size="12.5" text-anchor="middle">earliest appearance</text>
<rect x="410" y="214.0" width="160" height="92" rx="10" fill="#f1efff" stroke="#6d5efc" stroke-width="1.5"/>
<text x="490.0" y="248.0" font-size="15" font-weight="600" text-anchor="middle">4. AI detection</text>
<text class="m" x="490.0" y="267.0" font-size="12.5" text-anchor="middle">t0-vision (own model)</text>
<text class="m" x="490.0" y="284.0" font-size="12.5" text-anchor="middle">+ Jev visual review</text>
<rect x="605" y="139.0" width="160" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="685.0" y="173.0" font-size="15" font-weight="600" text-anchor="middle">5. Fact check</text>
<text class="m" x="685.0" y="192.0" font-size="12.5" text-anchor="middle">each claim checked</text>
<text class="m" x="685.0" y="209.0" font-size="12.5" text-anchor="middle">against the live web</text>
<rect x="800" y="139.0" width="160" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="880.0" y="173.0" font-size="15" font-weight="600" text-anchor="middle">6. Coverage &amp; bias</text>
<text class="m" x="880.0" y="192.0" font-size="12.5" text-anchor="middle">who is reporting it</text>
<text class="m" x="880.0" y="209.0" font-size="12.5" text-anchor="middle">and their lean</text>
<rect x="995" y="139.0" width="160" height="92" rx="10" fill="#f1efff" stroke="#6d5efc" stroke-width="1.5"/>
<text x="1075.0" y="173.0" font-size="15" font-weight="600" text-anchor="middle">7. Score</text>
<text class="m" x="1075.0" y="192.0" font-size="12.5" text-anchor="middle">0-100 + verdict,</text>
<text class="m" x="1075.0" y="209.0" font-size="12.5" text-anchor="middle">a reason per point</text>
<line x1="180" y1="185" x2="213" y2="185" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M375 185 C391.5 185 391.5 110 408 110" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M375 185 C391.5 185 391.5 260 408 260" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M570 110 C586.5 110 586.5 185 603 185" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M570 260 C586.5 260 586.5 185 603 185" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="765" y1="185" x2="798" y2="185" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="960" y1="185" x2="993" y2="185" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
</svg>