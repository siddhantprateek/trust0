<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Real photos wrongly flagged as AI"><style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--grid:#d0d7de;--c0:#6d5efc;--c1:#f59e0b;--c2:#0ea5e9;--c3:#9ca3af}
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--mut)}.g{stroke:var(--grid);stroke-width:1}
.b{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.h{transform-box:fill-box;transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.v{animation:fade .5s .8s both}@keyframes fade{from{opacity:0}to{opacity:1}}
*{animation:none!important}
</style><rect width="760" height="250" rx="10" fill="var(--bg)"/><text x="24" y="28" font-size="16" font-weight="600">Real photos wrongly flagged as AI (lower is better)</text><text class="m" x="24" y="46" font-size="12">300 ImageNet photos + 150 real faces, social-media compression</text><text x="140" y="87" font-size="12.5" text-anchor="end">t0-vision (ours)</text><rect class="h" style="animation-delay:0.00s" x="150" y="70" width="85.05" height="24" rx="4" fill="var(--c0)"><title>t0-vision (ours): 6.3%</title></rect><text class="v" x="243.05" y="87" font-size="12" font-weight="600">6%</text><text x="140" y="125" font-size="12.5" text-anchor="end">Smogy</text><rect class="h" style="animation-delay:0.08s" x="150" y="108" width="418.49999999999994" height="24" rx="4" fill="var(--c1)"><title>Smogy: 31.0%</title></rect><text class="v" x="576.5" y="125" font-size="12" font-weight="400">31%</text><text x="140" y="163" font-size="12.5" text-anchor="end">Ateeqq</text><rect class="h" style="animation-delay:0.16s" x="150" y="146" width="287.55" height="24" rx="4" fill="var(--c2)"><title>Ateeqq: 21.3%</title></rect><text class="v" x="445.55" y="163" font-size="12" font-weight="400">21%</text><text x="140" y="201" font-size="12.5" text-anchor="end">umm-maybe</text><rect class="h" style="animation-delay:0.24s" x="150" y="184" width="166.05" height="24" rx="4" fill="var(--c3)"><title>umm-maybe: 12.3%</title></rect><text class="v" x="324.05" y="201" font-size="12" font-weight="400">12%</text></svg>