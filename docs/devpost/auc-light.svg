ect><text class="v" x="190.0" y="140.0" font-size="10.5" text-anchor="middle" font-weight="400">0.70</text><rect class="b" style="animation-delay:0.15s" x="213.0" y="171.0" width="34" height="149.0" rx="4" fill="var(--c3)"><title>umm-maybe original: AUC 0.596</title></rect><text class="v" x="230.0" y="166.0" font-size="10.5" text-anchor="middle" font-weight="400">0.60</text><text x="170.0" y="342" font-size="12.5" text-anchor="middle">Original</text><rect class="b" style="animation-delay:0.20s" x="321.0" y="75.5" width="34" height="244.5" rx="4" fill="var(--c0)"><title>t0-vision (ours) social: AUC 0.978</title></rect><text class="v" x="338.0" y="70.5" font-size="10.5" text-anchor="middle" font-weight="600">0.98</text><rect class="b" style="animation-delay:0.25s" x="361.0" y="147.5" width="34" height="172.5" rx="4" fill="var(--c1)"><title>Smogy social: AUC 0.69</title></rect><text class="v" x="378.0" y="142.5" font-size="10.5" text-anchor="middle" font-weight="400">0.69</text><rect class="b" style="animation-delay:0.30s" x="401.0" y="144.25" width="34" height="175.75" rx="4" fill="var(--c2)"><title>Ateeqq social: AUC 0.703</title></rect><text class="v" x="418.0" y="139.25" font-size="10.5" text-anchor="middle" font-weight="400">0.70</text><rect class="b" style="animation-delay:0.35s" x="441.0" y="167.0" width="34" height="153.0" rx="4" fill="var(--c3)"><title>umm-maybe social: AUC 0.612</title></rect><text class="v" x="458.0" y="162.0" font-size="10.5" text-anchor="middle" font-weight="400">0.61</text><text x="398.0" y="342" font-size="12.5" text-anchor="middle">Social (X / Instagram)</text><rect class="b" style="animation-delay:0.40s" x="549.0" y="73.0" width="34" height="247.0" rx="4" fill="var(--c0)"><title>t0-vision (ours) repost: AUC 0.988</title></rect><text class="v" x="566.0" y="68.0" font-size="10.5" text-anchor="middle" font-weight="600">0.99</text><rect class="b" style="animation-delay:0.45s" x="589.0" y="151.0" width="34" height="169.0" rx="4" fill="var(-