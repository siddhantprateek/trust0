<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="AUC by detector and image condition"><style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--grid:#d0d7de;--c0:#6d5efc;--c1:#f59e0b;--c2:#0ea5e9;--c3:#9ca3af}
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{fill:var(--mut)}.g{stroke:var(--grid);stroke-width:1}
.b{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.h{transform-box:fill-box;transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.v{animation:fade .5s .8s both}@keyframes fade{from{opacity:0}to{opacity:1}}
*{animation:none!important}
