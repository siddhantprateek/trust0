<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trust0 Studio</title>
  </head>
  <body>
    <!-- Applies the saved/system theme before paint, so next-themes doesn't flash the wrong one on load -->
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('theme')
          const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          // localStorage can throw in locked-down contexts; fall back to the light theme
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
